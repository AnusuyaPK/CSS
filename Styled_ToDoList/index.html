<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="my-to-do-list">
        <h1>My To Do List</h1>

        <div class="list-of-items">
        <ul class="todo-list">
            <li>
                <div class="item">
                <input type="checkbox" id="book-ticket">
                <label for="book-ticket">Book tickets to Bangalore</label>
                <ul class="sub-item">
                    <li><a href="https://www.redbus.in/" target="_blank" class="sub-item-link">Red bus portal</a></li>
                </ul>
                </div>
            </li>
            <li>
                <div class="item">
                <input type="checkbox" id="buy-groceries">
                <label for="buy-groceries">Buy groceries for next week</label>
                <ul class="sub-item">
                    <li><a href="https://www.jiomart.com/" target="_blank" class="sub-item-link">Explore Jio Mart</a></li>
                </ul>
                </div>
            </li>
            <li>
                <div class="item">
                <input type="checkbox" id="pack-luggage">
                <label for="pack-luggage">Pack luggage for travel</label>
                <ul class="sub-item">
                    <li><a href="https://www.delhivery.com/" target="_blank" class="sub-item-link">Wanna send via delhivery??</a></li>
                </ul>
                </div>
            </li>
            <li>
                <div class="item">
                <input type="checkbox" id="complete-webdev">
                <label for="complete-webdev">Complete Web Dev Course</label>
                <ul class="sub-item">
                    <li><a href="https://www.freecodecamp.org/" target="_blank" class="sub-item-link">Hop onto Free Code Camp!</a></li>
                </ul>
                </div>
            </li>
        </ul>
        </div>
    </div>


</body>

</html>
